name: hajato
description: "HAJATO - Hajatan Organizer: Platform penghubung penyelenggara acara dengan vendor penyedia jasa"

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`.
# To see which dependencies have newer versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management using GetX
  get: ^4.6.6
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  fl_chart: ^0.68.0
  image_picker: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  share_plus: ^10.0.2
  uuid: ^4.4.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^20.1.0
  table_calendar: ^3.1.3
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  http: ^1.2.0
  http_parser: ^4.0.0
  path: ^1.9.0
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package contains a set of recommended lints
  # to encourage good coding practices.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/hajatonew.png" # Memakai logo andalanmu yang sudah terdaftar di aset
  adaptive_icon_background: "#00796B"       # Warna dasar background siluet Android
  adaptive_icon_foreground: "assets/images/hajatonew.png"
# ── 🟢 KONFIGURASI UTAMA SPLASH SCREEN (ANTI BLANK HITAM) ──
flutter_native_splash:
  color: "#FFFFFF" # Background diubah menjadi putih bersih
  image: "assets/images/logo.png" 
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#FFFFFF" # Background ikon Android 12 juga putih
  fullscreen: true

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # This line ensures that the Material Icons font is included
  # with your application.
  uses-material-design: true

  # To add assets to your application, add an assets section like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # An image asset can refer to one or more resolution-specific "variants"
  # see https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies:
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts, use a fonts section like this:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies:
  # https://flutter.dev/to/font-from-package